name = "herosms-notifier"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Έλεγχος διαθεσιμότητας κάθε λεπτό
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "BOT"
class_name = "BotObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotObject"]

[vars]
HERO_BASE = "https://hero-sms.io"   # διεύθυνση του HeroSMS (αν αλλάξει ξανά, αλλάζει μόνο εδώ)
WATCH = "ot:129:168"   # Any other, Greece, 7 days (υπηρεσία:χώρα[:ώρες], χωρισμένα με κόμμα)
MAX_BUY = ""           # μέγιστος αριθμός ανά αγορά (κενό = μέχρι όσο φτάνει το υπόλοιπο)
MAX_PRICE = ""         # ειδοποίηση μόνο αν η τιμή είναι <= αυτό (κενό = χωρίς όριο)

# Secrets (δεν μπαίνουν εδώ): HERO_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, WEBHOOK_SECRET
